name: Hugo build validation (no deployment)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugo-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      TZ: UTC
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Fixed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.4'
          architecture: x64
          check-latest: false
      - name: Hash-locked dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r pipeline/requirements.lock'
      - name: Checksum-pinned project-local Hugo
        run: python -B pipeline/install_hugo.py
      - name: Tests, snapshot, two Hugo builds and strict HTML verification
        run: python -B pipeline/ci.py --snapshot publication/fixture
      # Intentionally no artifact upload, Pages, environment or deployment job.
