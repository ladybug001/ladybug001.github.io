# Technical rendering harness only. No Theme, home/navigation/design choices.
baseURL = 'https://sample.invalid/'
disableKinds = ['home', 'section', 'taxonomy', 'term', 'RSS', 'sitemap', 'robotsTXT']
enableGitInfo = false
resourceDir = '../../.build/hugo-test-resources'
disableHugoGeneratorInject = true

# Eligibility is owned by the publisher. Never invent a creation date from
# lastmod or filesystem timestamps when the source has no reliable date.
[frontmatter]
date = ['date']
lastmod = ['lastmod']

[markup.goldmark.extensions]
linkify = false

[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

[markup.goldmark.parser.attribute]
block = true
title = true

[markup.goldmark.renderer]
# Every input is validated by the publisher/snapshot gate. The ONLY authored
# HTML admitted there is an attribute-free inline <br>; other HTML fails closed.
unsafe = true

[markup.highlight]
codeFences = true
